services:
  faceswap-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: faceswap-ai-studio:latest
    container_name: faceswap-ai-studio
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - USE_SSL=0          # 0 = HTTP (http://IP:7860), 1 = HTTPS (https://IP:7860)
      - GPU_MEM_LIMIT_GB=16                     # До 16GB VRAM для RTX 4090
      - CUDNN_CONV_ALGO_SEARCH=HEURISTIC       # Выбор алгоритмов для тензорных ядер (Tensor Cores)
      - USE_TF32=1                              # Активация TensorFloat-32 на тензорных ядрах 4-го поколения
      - NVIDIA_TF32_OVERRIDE=1                  # Принудительное ускорение cuDNN/cuBLAS через тензорные ядра
      - TORCH_ALLOW_TF32_CUBLAS_OVERRIDE=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    volumes:
      # :z флаг обязателен для Fedora с включенным SELinux
      - ./models:/app/models:ro,z
      - ./uploads:/app/uploads:z
      - ./outputs:/app/outputs:z
      - ./static:/app/static:z
    ipc: host
    shm_size: "16gb"       # Выделение shared memory для быстрой многопоточной обработки кадров
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
